<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-label="Disaster Response Pipeline — ETL to NLP to RandomForest to Flask, real-time disaster message routing">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0808"/>
      <stop offset="50%" stop-color="#4a0e0e"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <radialGradient id="glow" cx="85%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fb923c"/>
    </marker>
  </defs>

  <rect width="1200" height="280" fill="url(#bg)"/>
  <rect width="1200" height="280" fill="url(#grid)"/>
  <rect width="1200" height="280" fill="url(#glow)"/>

  <g transform="translate(720, 120)">
    <g opacity="0.9">
      <circle cx="0"   cy="0" r="26" fill="#1a0808" stroke="#f97316" stroke-width="2"/>
      <text x="0" y="4" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#fed7aa">ETL</text>

      <line x1="26" y1="0" x2="84" y2="0" stroke="#fb923c" stroke-width="1.5" marker-end="url(#arrowhead)"/>

      <circle cx="110" cy="0" r="26" fill="#1a0808" stroke="#eab308" stroke-width="2"/>
      <text x="110" y="4" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#fef08a">TF-IDF</text>

      <line x1="136" y1="0" x2="194" y2="0" stroke="#fb923c" stroke-width="1.5" marker-end="url(#arrowhead)"/>

      <circle cx="220" cy="0" r="26" fill="#1a0808" stroke="#dc2626" stroke-width="2"/>
      <text x="220" y="-1" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#fecaca">Random</text>
      <text x="220" y="10" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#fecaca">Forest</text>

      <line x1="246" y1="0" x2="304" y2="0" stroke="#fb923c" stroke-width="1.5" marker-end="url(#arrowhead)"/>

      <circle cx="330" cy="0" r="26" fill="#1a0808" stroke="#22c55e" stroke-width="2"/>
      <text x="330" y="4" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#bbf7d0">Flask</text>
    </g>
  </g>

  <rect x="60" y="70" width="4" height="54" fill="url(#accent)" rx="2"/>

  <text x="80" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#fdba74" letter-spacing="3">
    UDACITY DATA ENGINEERING NANODEGREE
  </text>

  <text x="60" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="52" font-weight="800" fill="#ffffff" letter-spacing="-1">
    Disaster Response
  </text>
  <text x="60" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="52" font-weight="800" fill="#f97316" letter-spacing="-1">
    Pipeline
  </text>

  <text x="60" y="250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#fed7aa">
    Multi-label message classification · real-time routing · Python · scikit-learn · Flask
  </text>

  <rect x="0" y="276" width="1200" height="4" fill="url(#accent)"/>
</svg>
